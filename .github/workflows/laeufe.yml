name: Läufe aktualisieren und veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"    # täglich ca. 6:17 Uhr deutscher Zeit
    - cron: "47 19 * * *"   # und abends ca. 21:47 Uhr
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Läufe von intervals.icu holen
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
        run: |
          if [ -z "$INTERVALS_API_KEY" ]; then
            echo "::warning::Secret INTERVALS_API_KEY fehlt – die Seite wird ohne neue Laufdaten veröffentlicht."
          else
            python3 tools/fetch_activities.py
          fi
      - name: Laufdaten committen
        run: |
          if [ -f data/activities.json ] && [ -n "$(git status --porcelain -- data/activities.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add data/activities.json
            git commit -m "Läufe aktualisiert"
            git push
          else
            echo "Keine neuen Läufe."
          fi
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site/data
          cp index.html _site/
          [ -f data/activities.json ] && cp data/activities.json _site/data/ || true
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # GitHub findet das Seitenpaket manchmal kurz nicht (Aussetzer auf deren Seite).
      # Dann 30 s warten und den Deploy einmal wiederholen.
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Kurz warten vor zweitem Versuch
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
